apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-team
  source:
    repoURL: https://github.com/spelluri/argocd-apps
    targetRevision: HEAD
    path: manifests/kustomize-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
