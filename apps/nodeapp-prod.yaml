apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodeapp-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: frontend-team
  source:
    repoURL: https://github.com/spelluri/argocd-apps
    targetRevision: HEAD
    path: manifests/nodeapp/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: nodeapp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
