apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/spelluri/argocd-apps
    targetRevision: HEAD
    path: charts/myapp
    helm:
      releaseName: myapp
      values: |
        replicaCount: 3
        image:
          repository: nginx
          tag: alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
