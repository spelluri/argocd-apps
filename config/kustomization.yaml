apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-cm.yaml

configMapGenerator:
  - name: argocd-rbac-cm
    namespace: argocd
    literals:
      - policy.default=role:readonly
    files:
      - policy.csv=rbac-policy.csv
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: argocd-rbac-cm
        app.kubernetes.io/part-of: argocd
